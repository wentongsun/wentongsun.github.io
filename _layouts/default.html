<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} &middot; {% endif %}{{ site.title }}</title>
    {% seo title=false %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <meta name="google-site-verification" content="iU7vEhtXOvLSaSECC2e_0wbVgW9xFDc7PqfriIKjAkw" />
  </head>
  <body>
    <header class="site-head">
      <nav class="site-nav">
        {% for item in site.nav %}
        <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} class="active"{% endif %}>{{ item.title }}</a>
        {% endfor %}
      </nav>
      <a class="site-title" href="{{ "/" | relative_url }}">{{ site.title }}</a>
    </header>

    <main class="content{% if page.wide %} content--wide{% endif %}">
      {{ content }}
    </main>

    <footer class="site-foot">
      <p class="foot-label">Affiliation</p>
      <p class="foot-affiliation">Department of Economics, Wuhan University</p>

      <!-- Logo strip: put institution logos in assets/img/ and uncomment.
      <div class="logo-strip">
        <img src="{{ "/assets/img/whu-logo.png" | relative_url }}" alt="Wuhan University">
      </div>
      -->

      <p class="foot-contact">sunwentong<span>[at]</span>whu.edu.cn</p>
    </footer>

    {% if site.google_analytics %}
    <script>
      (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
      (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
      m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
      ga('create', '{{ site.google_analytics }}', 'auto');
      ga('send', 'pageview');
    </script>
    {% endif %}
  </body>
</html>
